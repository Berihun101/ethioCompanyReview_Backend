services:
  - type: web
    name: ethio-company-review
    plan: free  # Explicitly declare (free tier has 512MB RAM)
    runtime: python
    buildCommand: "./build.sh"
    startCommand: >
      gunicorn ethio_company_review_backend.wsgi:application 
      --workers 1 
      --timeout 120 
      --worker-class gthread 
      --threads 2 
      --worker-tmp-dir /dev/shm 
      --max-requests 50  # Lower for memory-bound apps
      --max-requests-jitter 10
      --log-level warning
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ethio-company-review-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "ethio-company-review-6rigqm53y-berihun101s-projects.vercel.app,http://localhost:3000"
      - key: ALLOWED_HOSTS
        value: "ethio-company-review.onrender.com,yourdomain.com"
      - key: PYTHONUNBUFFERED  # Critical for logging
        value: "True"